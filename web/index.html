<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title> Show Finder</title>
    <link rel="stylesheet" href="style.css">
    <link rel = "preconnect" href = "https://fonts.googleapis.com">
    <link rel = "preconnect" href = "https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Redaction+10:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
</head>

<body>
<header class = "top">
    <h1>Show Finder</h1>
    <p> hi </p>
</header>

<main class = "main">
    <form id = "filters" class = "panel">
        <label> Do you remember the title? If so enter here:
            <input id="titlePrefix" type = "text" name = "titlePrefix" placeholder = "Enter a title">
        </label>
        <br>
        <label> Genre
            <select id = "genre" name = "genre">
                <option value=""> Any genre </option>
                <option> Action </option>
                <option> Adventure </option>
                <option>  Animation </option>
                <option>  Comedy </option>
                <option> Crime </option>
                <option> Documentary  </option>
                <option>  Drama </option>
                <option> Fantasy </option>
                <option> History </option>
                <option>  Horror </option>
                <option> Mystery </option>
                <option>  Romance </option>
                <option> Sci-Fi </option>
                <option> Thriller </option>
            </select>
        </label>

        <!-- maybe change to star system-->
        <label> Minimum rating: <output id="ratingOut"> 2.0</output>  <!--change to be dynamic-->
            <input id="ratingMin" type="range" min= "0" max ="10" step="0.1" value= "7">
        </label>

        <fieldset>
            <legend>Year Started</legend>
            <input id="yearMin" type="number" placeholder="2000" aria-label="From year">
            <span> to </span>
            <input id="yearMax" type="number" placeholder="2026" aria-label="To year">
        </fieldset>

        <label> Max Seasons
            <input id="seasonsMax" type="number" min="1" placeholder="Any">
        </label>
        <br>
        <label> Sort By:
            <select id = "sortBy" name = "sortBy">
                <option value="rating"> Rating </option>
                <option value="year"> Year </option>
                <option value="seasons"> Seasons </option>
                <option value="episodes"> Episodes </option>
                <option value="title"> Title </option>
            </select>
        </label>

        <label> Sorting Algorithm:
            <select id = "sortAlgo">
                <option value="quick"> Quicksort </option>
                <option value="merge"> Mergesort </option>
                <option value="heap"> Heapsort </option>
            </select>
        </label>

        <label class ="check">
            <input id= "descending" type = "checkbox" checked>
            Highest first
        </label>

        <div class = "buttons">
            <button type = "submit" id = "submit"> Find Shows </button>
            <button type = "button" id = "surprise"> Surprise Me </button>
        </div>

    </form>

    <section class = "results">
        <div id="pick" class="pick" hidden></div>
        <p id="status" class="status"></p>
        <ol id="list" class="list"></ol>
    </section>


</main>
<script src="script.js"></script>
</body>
</html>
